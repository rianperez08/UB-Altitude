# Static deploy (the game runs fully in the browser). Screens on one browser profile stay in sync
# through BroadcastChannel; for separate kiosk windows / PCs run server.js on the venue PC instead.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# Altitude Exchange coin analyzer: netlify/functions/analyze-coins.mjs → /api/analyze-coins
# (needs GEMINI_API_KEY in the project's environment variables, Functions scope).
[functions]
  node_bundler = "esbuild"
